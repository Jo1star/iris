<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iris</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
  }
  #root { height: 100%; display: flex; flex-direction: column; }

  .header {
    background: #fff; padding: 12px 16px;
    border-bottom: 1px solid #e5e5e7;
    display: flex; align-items: center; gap: 10px;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  .header img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
  .header .info { flex: 1; min-width: 0; }
  .header .name { font-weight: 600; font-size: 16px; color: #111; }
  .header .emotion { font-size: 12px; color: #888; margin-top: 2px; }
  .header button {
    background: none; border: 1px solid #d1d1d6;
    padding: 6px 12px; border-radius: 16px;
    font-size: 13px; color: #666; cursor: pointer;
    white-space: nowrap;
  }
  .header button:hover { background: #f5f5f7; }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .msg-wrap { display: flex; flex-direction: column; max-width: 78%; }
  .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.assistant { align-self: flex-start; align-items: flex-start; }

  .msg {
    padding: 10px 14px;
    border-radius: 18px; line-height: 1.5;
    font-size: 15px; word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .msg.user {
    background: #007aff; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    background: #fff; color: #111;
    border: 1px solid #e5e5e7; border-bottom-left-radius: 4px;
  }

  /* Markdown 样式 */
  .msg.assistant p { margin: 0 0 6px 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant code {
    background: #f5f5f7; padding: 1px 5px;
    border-radius: 4px; font-size: 13px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .msg.assistant pre {
    background: #f5f5f7; padding: 10px;
    border-radius: 8px; overflow-x: auto;
    margin: 6px 0; font-size: 13px;
  }
  .msg.assistant pre code { background: none; padding: 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 4px 0 4px 20px; }
  .msg.assistant li { margin: 2px 0; }
  .msg.assistant strong { font-weight: 600; }
  .msg.assistant em { font-style: italic; }
  .msg.assistant blockquote {
    border-left: 3px solid #d1d1d6;
    padding-left: 10px; margin: 4px 0; color: #666;
  }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 {
    margin: 8px 0 4px 0; font-weight: 600;
  }
  .msg.assistant h1 { font-size: 18px; }
  .msg.assistant h2 { font-size: 16px; }
  .msg.assistant h3 { font-size: 15px; }

  .msg.streaming::after {
    content: "▊"; opacity: 0.5; margin-left: 2px;
    animation: blink 0.7s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .time {
    font-size: 11px; color: #999;
    margin-top: 3px; padding: 0 4px;
  }

  .agent-msg {
    align-self: flex-start;
    background: #fff5e6; border: 1px solid #ffd699;
    padding: 8px 12px; border-radius: 12px;
    font-size: 13px; color: #8a5a00; max-width: 78%;
    line-height: 1.4;
  }
  .agent-msg .time-label { opacity: 0.6; margin-right: 6px; font-size: 11px; }
  .agent-msg .label { font-weight: 600; margin-right: 6px; }

  .footer {
    padding: 12px; background: #fff;
    border-top: 1px solid #e5e5e7;
    display: flex; gap: 8px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .footer input {
    flex: 1; padding: 10px 14px;
    border: 1px solid #d1d1d6; border-radius: 20px;
    font-size: 15px; outline: none; background: #f5f5f7;
  }
  .footer input:focus { background: #fff; border-color: #007aff; }
  .footer button {
    padding: 10px 20px; background: #007aff; color: #fff;
    border: none; border-radius: 20px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    min-width: 64px;
  }
  .footer button:disabled { opacity: 0.4; cursor: default; }

  /* 通用弹层 */
  .overlay-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    z-index: 100; animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } }

  /* 记忆抽屉 */
  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0;
    width: min(360px, 90vw); background: #fff;
    box-shadow: -2px 0 12px rgba(0,0,0,0.1);
    z-index: 101; display: flex; flex-direction: column;
    animation: slideIn 0.25s ease-out;
  }
  @keyframes slideIn { from { transform: translateX(100%); } }
  .drawer-header {
    padding: 16px; border-bottom: 1px solid #e5e5e7;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 16px;
  }
  .drawer-header button {
    background: none; border: none; font-size: 22px;
    color: #888; cursor: pointer; line-height: 1;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .drawer-section { margin-bottom: 20px; }
  .drawer-section h3 {
    font-size: 13px; color: #888; text-transform: uppercase;
    margin-bottom: 8px; letter-spacing: 0.5px;
  }
  .mem-item {
    padding: 8px 10px; background: #f5f5f7;
    border-radius: 8px; margin-bottom: 6px;
    font-size: 13px; line-height: 1.4;
  }
  .mem-item .type {
    display: inline-block; padding: 1px 6px;
    background: #007aff; color: #fff;
    border-radius: 4px; font-size: 10px;
    margin-right: 6px; vertical-align: middle;
  }
  .mem-item .imp { color: #888; font-size: 11px; float: right; }

  .empty { text-align: center; color: #999; font-size: 13px; padding: 20px; }

  /* 日记本弹窗 */
  .diary-modal {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fff; border-radius: 16px;
    width: min(880px, 92vw); height: min(80vh, 700px);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    z-index: 101;
    animation: fadeIn 0.2s;
  }
  .diary-modal-header {
    padding: 16px 20px; border-bottom: 1px solid #e5e5e7;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 16px;
  }
  .diary-modal-header button {
    background: none; border: none; font-size: 24px;
    color: #888; cursor: pointer; line-height: 1;
  }
  .diary-modal-body {
    flex: 1; display: flex; overflow: hidden;
  }
  .diary-sidebar {
    width: 160px; border-right: 1px solid #e5e5e7;
    overflow-y: auto; background: #fafafa;
    padding: 8px;
  }
  .diary-date {
    padding: 8px 12px; border-radius: 8px;
    cursor: pointer; font-size: 13px; color: #333;
    margin-bottom: 2px;
  }
  .diary-date:hover { background: #f0f0f0; }
  .diary-date.active {
    background: #007aff; color: #fff; font-weight: 500;
  }
  .diary-content {
    flex: 1; overflow-y: auto; padding: 20px 24px;
  }
  .diary-content pre {
    white-space: pre-wrap; word-wrap: break-word;
    font-family: inherit; font-size: 15px;
    line-height: 1.7; color: #222; margin: 0;
  }
  @media (max-width: 600px) {
    .diary-modal-body { flex-direction: column; }
    .diary-sidebar {
      width: 100%; max-height: 100px;
      border-right: none; border-bottom: 1px solid #e5e5e7;
      display: flex; gap: 6px; overflow-x: auto;
      padding: 8px;
    }
    .diary-date {
      flex-shrink: 0; padding: 6px 10px;
      margin-bottom: 0; white-space: nowrap;
    }
  }

  /* Toast */
  .toast {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 14px; z-index: 300;
    animation: fadeIn 0.2s;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function renderMarkdown(text) {
  if (typeof marked === 'undefined') return { __html: text };
  try {
    return { __html: marked.parse(text || '') };
  } catch (e) {
    return { __html: text };
  }
}

function fmtTime(iso) {
  if (!iso) return '';
  return iso.slice(11, 16);
}

// ============ 主组件 ============
function App() {
  const [messages, setMessages] = useState([]);
  const [agentMessages, setAgentMessages] = useState([]);
  const [emotion, setEmotion] = useState(null);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [diaryOpen, setDiaryOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const messagesRef = useRef(null);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  };

  const loadHistory = useCallback(async () => {
    try {
      const res = await fetch('/api/history?limit=50');
      setMessages(await res.json());
    } catch (e) { console.error(e); }
  }, []);

  const loadEmotion = useCallback(async () => {
    try {
      const res = await fetch('/api/emotion');
      setEmotion(await res.json());
    } catch (e) {}
  }, []);

  const loadAgentMessages = useCallback(async () => {
    try {
      const res = await fetch('/api/agent_messages?limit=5');
      setAgentMessages(await res.json());
    } catch (e) {}
  }, []);

  useEffect(() => {
    loadHistory();
    loadEmotion();
    loadAgentMessages();
    const t1 = setInterval(loadEmotion, 30000);
    const t2 = setInterval(loadAgentMessages, 60000);
    return () => { clearInterval(t1); clearInterval(t2); };
  }, [loadHistory, loadEmotion, loadAgentMessages]);

  useEffect(() => {
    if (messagesRef.current) {
      messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
    }
  }, [messages, agentMessages]);

  async function send() {
    const text = input.trim();
    if (!text || busy) return;
    setBusy(true);
    setInput('');
    const nowIso = new Date().toISOString();
    setMessages(m => [...m, { role: 'user', content: text, created_at: nowIso }]);
    setMessages(m => [...m, { role: 'assistant', content: '', created_at: nowIso, _streaming: true }]);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split('\n\n');
        buffer = events.pop() || '';
        for (const evt of events) {
          if (!evt.startsWith('data: ')) continue;
          const payload = JSON.parse(evt.slice(6));
          if (payload.delta) {
            fullText += payload.delta;
            setMessages(m => {
              const copy = [...m];
              const last = copy[copy.length - 1];
              if (last && last._streaming) copy[copy.length - 1] = { ...last, content: fullText };
              return copy;
            });
          }
          if (payload.error) {
            setMessages(m => {
              const copy = [...m];
              copy[copy.length - 1] = { role: 'assistant', content: '[错误] ' + payload.error };
              return copy;
            });
          }
          if (payload.done) {
            setMessages(m => {
              const copy = [...m];
              const last = copy[copy.length - 1];
              copy[copy.length - 1] = { role: 'assistant', content: payload.reply, created_at: last.created_at };
              return copy;
            });
            loadEmotion();
          }
        }
      }
    } catch (e) {
      setMessages(m => {
        const copy = [...m];
        copy[copy.length - 1] = { role: 'assistant', content: '[错误] ' + e.message };
        return copy;
      });
    } finally {
      setBusy(false);
    }
  }

  async function writeDiary() {
    try {
      const res = await fetch('/api/diary', { method: 'POST' });
      const data = await res.json();
      showToast(data.result || '已写入');
    } catch (e) {
      showToast('写日记失败：' + e.message);
    }
  }

  function onKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <>
      <div className="header">
        <img src="/iris.png" alt="" />
        <div className="info">
          <div className="name">Iris</div>
          <div className="emotion">
            {emotion ? `情绪：${emotion.state}（${Number(emotion.intensity).toFixed(2)}）` : '...'}
          </div>
        </div>
        <button onClick={writeDiary} title="让 Iris 写今天的日记">写日记</button>
        <button onClick={() => setDiaryOpen(true)}>日记本</button>
        <button onClick={() => setDrawerOpen(true)}>记忆</button>
      </div>

      <div className="messages" ref={messagesRef}>
        {agentMessages.slice().reverse().map(m => (
          <div key={'a' + m.id} className="agent-msg">
            <span className="time-label">{fmtTime(m.created_at)}</span>
            <span className="label">她主动说：</span>
            {m.content}
          </div>
        ))}
        {messages.map((m, i) => (
          <div key={i} className={'msg-wrap ' + m.role}>
            <div
              className={'msg ' + m.role + (m._streaming ? ' streaming' : '')}
              dangerouslySetInnerHTML={
                m.role === 'assistant' ? renderMarkdown(m.content) : undefined
              }
            >
              {m.role === 'user' ? m.content : null}
            </div>
            {m.created_at && <div className="time">{fmtTime(m.created_at)}</div>}
          </div>
        ))}
      </div>

      <div className="footer">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={onKeyDown}
          placeholder={busy ? 'Iris 正在回复...' : '和 Iris 说点什么...'}
          disabled={busy}
        />
        <button onClick={send} disabled={busy || !input.trim()}>
          {busy ? '...' : '发送'}
        </button>
      </div>

      {drawerOpen && <Drawer onClose={() => setDrawerOpen(false)} />}
      {diaryOpen && <DiaryModal onClose={() => setDiaryOpen(false)} />}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

// ============ 记忆抽屉 ============
function Drawer({ onClose }) {
  const [memories, setMemories] = useState([]);
  const [inner, setInner] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const [memRes, innerRes] = await Promise.all([
          fetch('/api/memories?limit=30'),
          fetch('/api/inner_state'),
        ]);
        setMemories(await memRes.json());
        setInner(await innerRes.json());
      } catch (e) { console.error(e); }
      setLoading(false);
    })();
  }, []);

  return (
    <>
      <div className="overlay-backdrop" onClick={onClose} />
      <div className="drawer">
        <div className="drawer-header">
          <span>Iris 的心</span>
          <button onClick={onClose}>×</button>
        </div>
        <div className="drawer-body">
          {loading && <div className="empty">加载中...</div>}
          {inner && (
            <div className="drawer-section">
              <h3>她现在在想</h3>
              {inner.last_thought && (
                <div className="mem-item"><strong>上次想法：</strong>{inner.last_thought}</div>
              )}
              {inner.current_focus && (
                <div className="mem-item"><strong>关注：</strong>{inner.current_focus}</div>
              )}
              {inner.pending_intent && (
                <div className="mem-item">
                  <strong>待办：</strong>{inner.pending_intent}
                  {inner.pending_intent_due && `（${inner.pending_intent_due.slice(0, 16)}）`}
                </div>
              )}
              {!inner.last_thought && !inner.current_focus && !inner.pending_intent && (
                <div className="empty">她还没想过什么</div>
              )}
            </div>
          )}
          <div className="drawer-section">
            <h3>长期记忆（{memories.length}）</h3>
            {memories.length === 0 && <div className="empty">还没有记忆</div>}
            {memories.map(m => (
              <div key={m.id} className="mem-item">
                <span className="type">{m.type}</span>
                {m.content}
                <span className="imp">{Number(m.importance).toFixed(2)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

// ============ 日记本弹窗 ============
function DiaryModal({ onClose }) {
  const [dates, setDates] = useState([]);
  const [selectedDate, setSelectedDate] = useState(null);
  const [content, setContent] = useState('');
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch('/api/diary_list');
        const list = await res.json();
        setDates(list);
        if (list.length > 0) setSelectedDate(list[0]);
      } catch (e) { console.error(e); }
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (!selectedDate) return;
    (async () => {
      try {
        const res = await fetch(`/api/diary_content?date=${selectedDate}`);
        const data = await res.json();
        setContent(data.content);
      } catch (e) { setContent('读取失败'); }
    })();
  }, [selectedDate]);

  return (
    <>
      <div className="overlay-backdrop" onClick={onClose} />
      <div className="diary-modal">
        <div className="diary-modal-header">
          <span>Iris 的日记本</span>
          <button onClick={onClose}>×</button>
        </div>
        <div className="diary-modal-body">
          <div className="diary-sidebar">
            {loading && <div className="empty">加载中...</div>}
            {!loading && dates.length === 0 && (
              <div className="empty" style={{padding: '20px 10px'}}>还没有日记</div>
            )}
            {dates.map(d => (
              <div
                key={d}
                className={'diary-date' + (d === selectedDate ? ' active' : '')}
                onClick={() => setSelectedDate(d)}
              >
                {d}
              </div>
            ))}
          </div>
          <div className="diary-content">
            {selectedDate ? (
              <pre>{content}</pre>
            ) : (
              <div className="empty">选择左边的日期查看日记</div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

// ============ 渲染 ============
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
